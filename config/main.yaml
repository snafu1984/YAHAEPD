# ============================================================
# DEVICE CONFIGURATION
# ============================================================
substitutions:
  device_name: reterminal-e1001
  friendly_name: "reTerminal E1001"

# ============================================================
# ESPHOME
# ============================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # ----------------------------------------------------------
  # Startup
  # ----------------------------------------------------------
  on_boot:
    priority: 600
    then:
      - switch.turn_on: battery_enable
      - delay: 200ms
      - component.update: battery_voltage

# ============================================================
# ESP32
# ============================================================
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# ============================================================
# LOGGER
# ============================================================
logger:
  hardware_uart: UART0

# ============================================================
# ESPHOME API
# ============================================================
api:
  encryption:
    key: !secret api_encryption_key_3

  # ----------------------------------------------------------
  # Home Assistant connection
  # ----------------------------------------------------------
  on_client_connected:
    then:
      - logger.log: "=== HOME ASSISTANT API CONNECTED ==="

# ============================================================
# OTA
# ============================================================
ota:
  - platform: esphome

# ============================================================
# WIFI
# ============================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # ----------------------------------------------------------
  # Fallback access point
  # ----------------------------------------------------------
  ap:
    ssid: "reTerminal-E1001"
    password: "ChangeMe123"

captive_portal:

# ============================================================
# SPI BUS
# ============================================================
# Seeed Studio hardware reference:
#   CLK  -> GPIO7
#   MOSI -> GPIO9
#   MISO -> GPIO8
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

# ============================================================
# I2C BUS
# ============================================================
# Used for the PCF8563 hardware RTC.
#
# The SHT4x sensor is also connected to this bus at address
# 0x44 but is intentionally not used in this configuration.
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

# ============================================================
# TIME AND RTC
# ============================================================
time:
  # ----------------------------------------------------------
  # Home Assistant time
  # ----------------------------------------------------------
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - logger.log: "=== HOME ASSISTANT TIME SYNCHRONIZED ==="

        # Synchronize the hardware RTC with Home Assistant.
        - pcf8563.write_time:
            id: pcf8563_time

        # Schedule the next display update and sleep period.
        - script.execute: schedule_deep_sleep

  # ----------------------------------------------------------
  # PCF8563 hardware RTC
  # ----------------------------------------------------------
  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    update_interval: never

# ============================================================
# SWITCHES
# ============================================================
switch:
  # ----------------------------------------------------------
  # Battery measurement enable
  # ----------------------------------------------------------
  - platform: gpio
    pin: GPIO21
    id: battery_enable
    internal: true

  # ----------------------------------------------------------
  # Deep Sleep enable
  # ----------------------------------------------------------
  # This switch is exposed to Home Assistant.
  #
  # ON:
  #   Deep Sleep follows the configured schedule.
  #
  # OFF:
  #   Deep Sleep is prevented and the device remains awake.
  - platform: template
    name: "Deep Sleep"
    id: deep_sleep_enabled
    icon: "mdi:sleep"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

    on_turn_on:
      then:
        - deep_sleep.allow: deep_sleep_1
        - logger.log: "=== DEEP SLEEP ENABLED ==="

    on_turn_off:
      then:
        - deep_sleep.prevent: deep_sleep_1
        - logger.log: "=== DEEP SLEEP DISABLED ==="

# ============================================================
# ONBOARD STATUS LED
# ============================================================
# Onboard LED:
#   GPIO6
status_led:
  pin:
    number: GPIO6
    inverted: false

# ============================================================
# SENSORS
# ============================================================
sensor:
  # ----------------------------------------------------------
  # Battery voltage
  # ----------------------------------------------------------
  # Battery voltage is measured through the ADC on GPIO1.
  # The measured voltage is doubled because of the hardware
  # voltage divider used by the reTerminal E1001.
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: 60s

    filters:
      - multiply: 2.0

    on_value:
      then:
        - lambda: |-
            ESP_LOGD(
              "battery",
              "Battery voltage: %.3f V",
              x
            );

  # ----------------------------------------------------------
  # Battery level
  # ----------------------------------------------------------
  # Battery percentage is calculated from the battery voltage
  # using the voltage curve supplied for the reTerminal E1001.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s

    lambda: |-
      return id(battery_voltage).state;

    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0

      - clamp:
          min_value: 0
          max_value: 100

    on_value:
      then:
        - lambda: |-
            ESP_LOGD(
              "battery",
              "Battery level: %.0f %% (%.3f V)",
              x,
              id(battery_voltage).state
            );

# ============================================================
# DEEP SLEEP
# ============================================================
deep_sleep:
  id: deep_sleep_1

# ============================================================
# DEEP SLEEP SCHEDULE
# ============================================================

script:
  - id: schedule_deep_sleep
    mode: restart

    then:
      # --------------------------------------------------------
      # Determine current time
      # --------------------------------------------------------
      - lambda: |-
          auto now = id(homeassistant_time).now();

          if (!now.is_valid()) {
            ESP_LOGW(
              "deep_sleep",
              "Time is not valid - staying awake"
            );
            return;
          }

          ESP_LOGD(
            "deep_sleep",
            "Current time: %02d:%02d:%02d",
            now.hour,
            now.minute,
            now.second
          );

      # --------------------------------------------------------
      # Decide whether to refresh the display
      #
      # Skip the refresh when:
      # - Deep Sleep is enabled and it is 23:00 or later
      # - Deep Sleep is enabled and the next full hour is
      #   30 seconds away or less
      # --------------------------------------------------------
      - if:
          condition:
            lambda: |-
              auto now = id(homeassistant_time).now();

              if (!now.is_valid()) {
                return false;
              }

              if (!id(deep_sleep_enabled).state) {
                return false;
              }

              const int seconds_to_hour =
                3600 - (now.minute * 60) - now.second;

              return now.hour >= 23 || seconds_to_hour <= 30;

          then:
            - logger.log:
                level: INFO
                format: "Skipping display refresh: close to scheduled wake-up or night mode"

          else:
            # Update battery voltage
            - component.update: battery_voltage
            - delay: 200ms

            # Recalculate battery percentage
            - component.update: battery_level
            - delay: 100ms

            # Refresh the ePaper display
            - component.update: epaper_display

            # Allow the display update to finish
            - delay: 1s

      # --------------------------------------------------------
      # Enter Deep Sleep according to the schedule
      # --------------------------------------------------------
      - if:
          condition:
            lambda: |-
              return id(deep_sleep_enabled).state &&
                     id(homeassistant_time).now().is_valid();

          then:
            - deep_sleep.enter:
                id: deep_sleep_1

                sleep_duration: !lambda |-
                  auto now = id(homeassistant_time).now();

                  uint32_t sleep_seconds;

                  // ------------------------------------------------
                  // Night mode: sleep until 06:00
                  // ------------------------------------------------
                  if (now.hour >= 23) {

                    sleep_seconds =
                      ((24 - now.hour) * 3600) -
                      (now.minute * 60) -
                      now.second +
                      (6 * 3600);

                    ESP_LOGD(
                      "deep_sleep",
                      "Night mode: sleeping until 06:00"
                    );

                  // ------------------------------------------------
                  // Day mode: sleep until the next full hour
                  // ------------------------------------------------
                  } else {

                    sleep_seconds =
                      3600 -
                      (now.minute * 60) -
                      now.second;

                    ESP_LOGD(
                      "deep_sleep",
                      "Day mode: sleeping until the next full hour"
                    );
                  }

                  ESP_LOGD(
                    "deep_sleep",
                    "Sleep duration: %lu seconds",
                    static_cast<unsigned long>(sleep_seconds)
                  );

                  return sleep_seconds * 1000UL;

          else:
            - logger.log:
                level: INFO
                format: "Deep Sleep disabled or time invalid"

# ============================================================
# FONTS
# ============================================================
font:
  # ----------------------------------------------------------
  # Main display font
  # ----------------------------------------------------------
  - file: "gfonts://Roboto@700"
    id: font_medium
    size: 32

# ============================================================
# EPAPER DISPLAY
# ============================================================
# Display:
#   Seeed Studio reTerminal E1001
#   Waveshare 7.5"
#   Resolution: 800 x 480
display:
  # ----------------------------------------------------------
  # Waveshare ePaper
  # ----------------------------------------------------------
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2

    cs_pin: GPIO10
    dc_pin: GPIO11

    reset_pin:
      number: GPIO12
      inverted: false

    busy_pin:
      number: GPIO13
      inverted: true

    # Display is updated manually by the Deep Sleep schedule.
    update_interval: never

    lambda: |-
      // --------------------------------------------------------
      // Display refresh
      // --------------------------------------------------------
      ESP_LOGD(
        "display",
        "=== ePaper display refresh ==="
      );

      // --------------------------------------------------------
      // Determine display mode
      // --------------------------------------------------------
      // Normal battery level:
      //   > 10 % -> black text on white background
      //
      // Low battery:
      //   <= 10 % -> white text on black background
      const bool inverted =
        !isnan(id(battery_level).state) &&
        id(battery_level).state <= 10.0;

      ESP_LOGD(
        "display",
        "Battery: %.0f %% -> display inverted: %s",
        id(battery_level).state,
        inverted ? "YES" : "NO"
      );

      // --------------------------------------------------------
      // Background
      // --------------------------------------------------------
      // ESPHome's ePaper color handling is inverted for this
      // display configuration.
      if (inverted) {
        // Low battery: black background.
        it.fill(Color::WHITE);
      } else {
        // Normal operation: white background.
        it.fill(Color::BLACK);
      }

      // --------------------------------------------------------
      // Text color
      // --------------------------------------------------------
      const Color text_color =
        inverted ? Color::BLACK : Color::WHITE;

      // --------------------------------------------------------
      // Display content
      // --------------------------------------------------------
      it.printf(
        400, 15,
        id(font_medium),
        text_color,
        TextAlign::TOP_CENTER,
        "reTerminal E1001"
      );

      it.printf(
        400, 65,
        id(font_medium),
        text_color,
        TextAlign::TOP_CENTER,
        "ESPHome Test"
      );
