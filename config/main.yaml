substitutions:
  device_name: reterminal-e1001
  friendly_name: "reTerminal E1001"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # ==========================================================
  # STARTUP
  # ==========================================================
  # Enable the battery measurement circuit at startup.
  on_boot:
    priority: 600
    then:
      - switch.turn_on: battery_enable
      - delay: 200ms
      - component.update: battery_voltage

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# --------------------------------------------------
# Serial debug
# Seeed: CH340K -> UART0
# --------------------------------------------------

logger:
  hardware_uart: UART0

# --------------------------------------------------
# Home Assistant API
# --------------------------------------------------

api:

# --------------------------------------------------
# OTA
# --------------------------------------------------

ota:
  - platform: esphome

# --------------------------------------------------
# WiFi
# --------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "reTerminal-E1001"
    password: "ChangeMe123"

captive_portal:

# --------------------------------------------------
# SPI
# Seeed hardware reference
# --------------------------------------------------
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

# ============================================================
# I2C BUS
# ============================================================
# I2C bus for the PCF8563 RTC
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

# ============================================================
# RTC - PCF8563
# ============================================================
# PCF8563 Real-Time Clock
# I2C address: 0x51
time:
  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    update_interval: never

# ============================================================
# BATTERY MONITORING
# ============================================================
# Enable the battery voltage measurement circuit.
switch:
  - platform: gpio
    pin: GPIO21
    id: battery_enable
    internal: true


# ============================================================
# BATTERY VOLTAGE
# ============================================================
# Battery voltage is measured via the ADC on GPIO1.
sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: 60s

    filters:
      - multiply: 2.0

    on_value:
      then:
        - lambda: |-
            ESP_LOGD("battery", "Battery voltage: %.3f V", x);


  # ==========================================================
  # BATTERY LEVEL
  # ==========================================================
  # Battery percentage based on the Seeed Studio voltage curve.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s

    lambda: |-
      return id(battery_voltage).state;

    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0

      - clamp:
          min_value: 0
          max_value: 100

    on_value:
      then:
        - lambda: |-
            ESP_LOGD(
              "battery",
              "Battery level: %.0f %% (%.3f V)",
              x,
              id(battery_voltage).state
            );

# --------------------------------------------------
# Test font
# --------------------------------------------------

font:
  - file: "gfonts://Inter@700"
    id: font_medium
    size: 32

# --------------------------------------------------
# ePaper display
# 800 x 480
# --------------------------------------------------

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2

    cs_pin: GPIO10
    dc_pin: GPIO11

    reset_pin:
      number: GPIO12
      inverted: false

    busy_pin:
      number: GPIO13
      inverted: true

    update_interval: 300s

    lambda: |-
      ESP_LOGD("display", "=== ePaper display refresh ===");

      // ========================================================
      // DETERMINE DISPLAY MODE
      // ========================================================
      // Normal:
      //   > 10 %  -> black text on white background
      //
      // Low battery:
      //   <= 10 % -> white text on black background
      const bool inverted =
        !isnan(id(battery_level).state) &&
        id(battery_level).state <= 10.0;

      ESP_LOGD(
        "display",
        "Battery: %.0f %% -> display inverted: %s",
        id(battery_level).state,
        inverted ? "YES" : "NO"
      );


      // ========================================================
      // BACKGROUND
      // ========================================================
      // ESPHome waveshare_epaper uses inverted color semantics.
      if (inverted) {
        // Low battery: black background
        it.fill(Color::WHITE);
      } else {
        // Normal: white background
        it.fill(Color::BLACK);
      }


      // ========================================================
      // TEXT COLOR
      // ========================================================
      const Color text_color =
        inverted ? Color::BLACK : Color::WHITE;


      // ========================================================
      // DISPLAY CONTENT
      // ========================================================
      it.printf(
        400, 15,
        id(font_medium),
        text_color,
        TextAlign::TOP_CENTER,
        "reTerminal E1001"
      );

      it.printf(
        400, 65,
        id(font_medium),
        text_color,
        TextAlign::TOP_CENTER,
        "ESPHome Test"
      );
