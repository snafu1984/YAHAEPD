# ============================================================
# DEVICE CONFIGURATION
# ============================================================
substitutions:
  device_name: reterminal-e1001
  friendly_name: "reTerminal E1001"
  font_file: "../fonts/Gotham-Rounded-Bold.ttf"
  sym_file: "../fonts/materialdesignicons-webfont.ttf"


# ============================================================
# ESPHOME
# ============================================================
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # ----------------------------------------------------------
  # Startup
  # ----------------------------------------------------------
  on_boot:
    priority: 600
    then:
    - lambda: |-
        const esp_sleep_wakeup_cause_t cause =
        esp_sleep_get_wakeup_cause();

              id(key_update_wakeup) =
                (cause == ESP_SLEEP_WAKEUP_EXT1);

              if (id(key_update_wakeup)) {
                ESP_LOGI(
                  "key_update",
                  "KEY0 wake-up detected (EXT1): forcing display refresh"
                );
              } else {
                ESP_LOGI(
                  "key_update",
                  "No KEY0 wake-up; wake-up cause: %d",
                  static_cast<int>(cause)
                );
              }

    - switch.turn_on: battery_enable
    - delay: 200ms
    - component.update: battery_voltage

# ============================================================
# ESP32
# ============================================================
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino


# ============================================================
# Includes
# ============================================================
packages:
  display: !include packages/display.yaml
  sensors: !include packages/sensors.yaml
  fonts: !include packages/font.yaml
  symbols: !include packages/symbol.yaml
  key_update: !include packages/key_update.yaml

# ============================================================
# LOGGER
# ============================================================
logger:
  hardware_uart: UART0

# ============================================================
# ESPHOME API
# ============================================================
api:
  encryption:
    key: !secret api_encryption_key

  # ----------------------------------------------------------
  # Home Assistant connection
  # ----------------------------------------------------------
  on_client_connected:
    then:
      - logger.log: "=== HOME ASSISTANT API CONNECTED ==="

# ============================================================
# OTA
# ============================================================
ota:
  - platform: esphome
    password: !secret ota_password
# ============================================================
# WIFI
# ============================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # ----------------------------------------------------------
  # Fallback access point
  # ----------------------------------------------------------
  ap:
    ssid: "reTerminal-E1001"
    password: "ChangeMe123"

captive_portal:

# ============================================================
# SPI BUS
# ============================================================
# Seeed Studio hardware reference:
#   CLK  -> GPIO7
#   MOSI -> GPIO9
#   MISO -> GPIO8
spi:
  id: epaper_spi_bus
  clk_pin: GPIO7
  mosi_pin: GPIO9
  miso_pin: GPIO8

# ============================================================
# I2C BUS
# ============================================================
# Used for the PCF8563 hardware RTC.
#
# The SHT4x sensor is also connected to this bus at address
# 0x44 but is intentionally not used in this configuration.
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

# ============================================================
# TIME AND RTC
# ============================================================
time:
  # ----------------------------------------------------------
  # Home Assistant time
  # ----------------------------------------------------------
  - platform: homeassistant
    id: homeassistant_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - logger.log: "=== HOME ASSISTANT TIME SYNCHRONIZED ==="

        # Synchronize the hardware RTC with Home Assistant.
        - pcf8563.write_time:
            id: pcf8563_time

        # Schedule the next display update and sleep period.
        - script.execute: schedule_deep_sleep

  # ----------------------------------------------------------
  # PCF8563 hardware RTC
  # ----------------------------------------------------------
  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    update_interval: never

# ============================================================
# SWITCHES
# ============================================================
switch:
  # ----------------------------------------------------------
  # Battery measurement enable
  # ----------------------------------------------------------
  - platform: gpio
    pin: GPIO21
    id: battery_enable
    internal: true

  # ----------------------------------------------------------
  # Deep Sleep enable
  # ----------------------------------------------------------
  # This switch is exposed to Home Assistant.
  #
  # ON:
  #   Deep Sleep follows the configured schedule.
  #
  # OFF:
  #   Deep Sleep is prevented and the device remains awake.
  - platform: template
    name: "Deep Sleep"
    id: deep_sleep_enabled
    icon: "mdi:sleep"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

    on_turn_on:
      then:
        - deep_sleep.allow: deep_sleep_1
        - logger.log: "=== DEEP SLEEP ENABLED ==="

    on_turn_off:
      then:
        - deep_sleep.prevent: deep_sleep_1
        - logger.log: "=== DEEP SLEEP DISABLED ==="

# ============================================================
# ONBOARD STATUS LED
# ============================================================
# Onboard LED:
#   GPIO6
status_led:
  pin:
    number: GPIO6
    inverted: false

# ============================================================
# SENSORS
# ============================================================
sensor:
  # ----------------------------------------------------------
  # Battery voltage
  # ----------------------------------------------------------
  # Battery voltage is measured through the ADC on GPIO1.
  # The measured voltage is doubled because of the hardware
  # voltage divider used by the reTerminal E1001.
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: 60s

    filters:
      - multiply: 2.0

    on_value:
      then:
        - lambda: |-
            ESP_LOGD(
              "battery",
              "Battery voltage: %.3f V",
              x
            );

  # ----------------------------------------------------------
  # Battery level
  # ----------------------------------------------------------
  # Battery percentage is calculated from the battery voltage
  # using the voltage curve supplied for the reTerminal E1001.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s

    lambda: |-
      return id(battery_voltage).state;

    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0

      - clamp:
          min_value: 0
          max_value: 100

    on_value:
      then:
        - lambda: |-
            ESP_LOGD(
              "battery",
              "Battery level: %.0f %% (%.3f V)",
              x,
              id(battery_voltage).state
            );

# ============================================================
# DEEP SLEEP
# ============================================================
deep_sleep:
  id: deep_sleep_1

# ============================================================
# DEEP SLEEP SCHEDULE
# ============================================================

script:
  - id: schedule_deep_sleep
    mode: restart

    then:
      # --------------------------------------------------------
      # Determine current time
      # --------------------------------------------------------
      - lambda: |-
          auto now = id(homeassistant_time).now();

          if (!now.is_valid()) {
            ESP_LOGW(
              "deep_sleep",
              "Time is not valid - staying awake"
            );
            return;
          }

          ESP_LOGD(
            "deep_sleep",
            "Current time: %02d:%02d:%02d",
            now.hour,
            now.minute,
            now.second
          );

      # --------------------------------------------------------
      # Decide whether to refresh the display
      #
      # Skip the refresh when:
      # - Deep Sleep is enabled and it is 23:00 or later
      # - Deep Sleep is enabled and the next full hour is
      #   30 seconds away or less
      # --------------------------------------------------------

      - if:
          condition:
            lambda: |-
              auto now = id(homeassistant_time).now();

              if (!now.is_valid()) {
                return false;
              }

              if (!id(deep_sleep_enabled).state) {
                return false;
              }

              // Manueller KEY0-Wake-up hat Vorrang.
              if (id(key_update_wakeup)) {
                ESP_LOGI(
                  "key_update",
                  "Manual wake-up overrides the scheduled refresh skip"
                );
                return false;
              }

              const int seconds_to_hour =
                3600 - (now.minute * 60) - now.second;

              return now.hour >= 23 || seconds_to_hour <= 30;
          then:
            - logger.log:
                level: INFO
                format: "Skipping display refresh: close to scheduled wake-up or night mode"
          else:
            - component.update: battery_voltage
            - delay: 200ms
            - component.update: battery_level
            - delay: 100ms
            # --------------------------------------------------------
            # Wait for Home Assistant sensor states
            # --------------------------------------------------------
            - wait_until:
                condition:
                  lambda: |-
                    return
                      // Current weather
                      id(current_weather_condition).has_state() &&
                      id(current_temperature).has_state() &&
                      id(rain_today).has_state() &&
                      id(rain_yesterday).has_state() &&

                      // Sunrise, sunset and moon phase
                      id(sunrise_time).has_state() &&
                      id(sunset_time).has_state() &&
                      id(moon_phase).has_state() &&

                      // Hourly weather forecast
                      id(forecast_hour_1).has_state() &&
                      id(forecast_hour_2).has_state() &&
                      id(forecast_hour_3).has_state() &&
                      id(forecast_hour_4).has_state() &&

                      // Daily weather forecast
                      id(forecast_day_1).has_state() &&
                      id(forecast_day_2).has_state() &&
                      id(forecast_day_3).has_state() &&
                      id(forecast_day_4).has_state() &&

                      // Birthday calendar: weekdays
                      id(calendar_a1).has_state() &&
                      id(calendar_a2).has_state() &&
                      id(calendar_a3).has_state() &&
                      id(calendar_a4).has_state() &&

                      // Birthday calendar: dates
                      id(calendar_b1).has_state() &&
                      id(calendar_b2).has_state() &&
                      id(calendar_b3).has_state() &&
                      id(calendar_b4).has_state() &&

                      // Birthday calendar: names
                      id(calendar_c1).has_state() &&
                      id(calendar_c2).has_state() &&
                      id(calendar_c3).has_state() &&
                      id(calendar_c4).has_state();
                timeout: 15s
            - component.update: epaper_display
            - delay: 10s
            - lambda: |-
                id(key_update_wakeup) = false;


      # --------------------------------------------------------
      # Enter Deep Sleep according to the schedule
      # --------------------------------------------------------
      - if:
          condition:
            lambda: |-
              return id(deep_sleep_enabled).state &&
                     id(homeassistant_time).now().is_valid();

          then:
            - deep_sleep.enter:
                id: deep_sleep_1

                sleep_duration: !lambda |-
                  auto now = id(homeassistant_time).now();

                  uint32_t sleep_seconds;

                  // ------------------------------------------------
                  // Night mode: sleep until 06:00
                  // ------------------------------------------------
                  if (now.hour >= 23) {

                    sleep_seconds =
                      ((24 - now.hour) * 3600) -
                      (now.minute * 60) -
                      now.second +
                      (6 * 3600);

                    ESP_LOGD(
                      "deep_sleep",
                      "Night mode: sleeping until 06:00"
                    );

                  // ------------------------------------------------
                  // Day mode: sleep until the next full hour
                  // ------------------------------------------------
                  } else {

                    sleep_seconds =
                      3600 -
                      (now.minute * 60) -
                      now.second;

                    ESP_LOGD(
                      "deep_sleep",
                      "Day mode: sleeping until the next full hour"
                    );
                  }

                  ESP_LOGD(
                    "deep_sleep",
                    "Sleep duration: %lu seconds",
                    static_cast<unsigned long>(sleep_seconds)
                  );

                  return sleep_seconds * 1000UL;

          else:
            - logger.log:
                level: INFO
                format: "Deep Sleep disabled or time invalid"
