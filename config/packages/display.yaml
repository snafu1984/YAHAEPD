
# ============================================================
# EPAPER DISPLAY
# ============================================================

# Display:
#   Seeed Studio reTerminal E1001
#   Waveshare 7.5"
#   Resolution: 800 x 480
#
# Layout:
#   Y = 0..300     Weather (to be implemented)
#   Y = 300..480   Birthday calendar

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2

    cs_pin: GPIO10
    dc_pin: GPIO11

    reset_pin:
      number: GPIO12
      inverted: false

    busy_pin:
      number: GPIO13
      inverted: true

    # Display is updated manually by the Deep Sleep schedule.
    update_interval: never

    lambda: |-
      // --------------------------------------------------------
      // Display refresh
      // --------------------------------------------------------
      ESP_LOGD(
        "display",
        "=== ePaper display refresh ==="
      );

      // --------------------------------------------------------
      // Determine display mode
      // --------------------------------------------------------
      // Normal battery level:
      //   > 10 % -> black text on white background
      //
      // Low battery:
      //   <= 10 % -> white text on black background
      const bool inverted =
        !isnan(id(battery_level).state) &&
        id(battery_level).state <= 10.0;

      ESP_LOGD(
        "display",
        "Battery: %.0f %% -> display inverted: %s",
        id(battery_level).state,
        inverted ? "YES" : "NO"
      );

      // --------------------------------------------------------
      // Background
      // --------------------------------------------------------
      // ESPHome's ePaper color handling is inverted for this
      // display configuration.
      if (inverted) {
        // Low battery: black background.
        it.fill(Color::WHITE);
      } else {
        // Normal operation: white background.
        it.fill(Color::BLACK);
      }

      // --------------------------------------------------------
      // Text color
      // --------------------------------------------------------
      const Color text_color =
        inverted ? Color::BLACK : Color::WHITE;

      // Material Design Icons
      auto weather_icon = [](const std::string &condition) -> const char * {
        if (condition == "sunny") return "\U000F0599";
        if (condition == "clear-night") return "\U000F0594";
        if (condition == "partlycloudy") return "\U000F0595";
        if (condition == "cloudy") return "\U000F0590";
        if (condition == "rainy") return "\U000F0597";
        if (condition == "pouring") return "\U000F0596";
        if (condition == "snowy") return "\U000F059B";
        if (condition == "snowy-rainy") return "\U000F067F";
        if (condition == "fog") return "\U000F0591";
        if (condition == "windy") return "\U000F059D";
        if (condition == "windy-variant") return "\U000F059E";
        if (condition == "hail") return "\U000F0592";
        if (condition == "lightning") return "\U000F0593";
        if (condition == "lightning-rainy") return "\U000F067E";
        return "\U000F0590";
      };

      // ------------------------------------------------------------
      // Wochentag und Datum – horizontal zentriert
      // ------------------------------------------------------------
      auto now = id(homeassistant_time).now();

      if (now.is_valid()) {
        const char* weekdays[] = {
          "So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"
        };

        it.printf(
          133, 16,
          id(font_42),
          text_color,
          TextAlign::TOP_CENTER,
          "%s %02d.%02d.",
          weekdays[now.day_of_week - 1],
          now.day_of_month,
          now.month
        );
      }

      // --------------------------------------------------------
      // CURRENT WEATHER
      // Area: X = 0..265
      // --------------------------------------------------------

      // Read current weather condition from Home Assistant.
      const std::string current_condition =
        id(current_weather_condition).state;

      // Translate Home Assistant weather conditions into German.
      const char* current_condition_de = "Unbekannt";

      if (current_condition == "sunny") {
        current_condition_de = "Sonnig";
      } else if (current_condition == "clear-night") {
        current_condition_de = "Klare Nacht";
      } else if (current_condition == "partlycloudy") {
        current_condition_de = "Heiter";
      } else if (current_condition == "cloudy") {
        current_condition_de = "Bewoelkt";
      } else if (current_condition == "rainy") {
        current_condition_de = "Regen";
      } else if (current_condition == "pouring") {
        current_condition_de = "Starkregen";
      } else if (current_condition == "snowy") {
        current_condition_de = "Schnee";
      } else if (current_condition == "snowy-rainy") {
        current_condition_de = "Schneeregen";
      } else if (current_condition == "fog") {
        current_condition_de = "Nebel";
      } else if (current_condition == "windy") {
        current_condition_de = "Windig";
      } else if (current_condition == "windy-variant") {
        current_condition_de = "Windig";
      } else if (current_condition == "hail") {
        current_condition_de = "Hagel";
      } else if (current_condition == "lightning") {
        current_condition_de = "Gewitter";
      } else if (current_condition == "lightning-rainy") {
        current_condition_de = "Gewitter";
      }

      // Current weather icon.
      it.printf(
        133, 100,
        id(sym_current_weather),
        text_color,
        TextAlign::CENTER,
        "%s",
        weather_icon(current_condition)
      );

      // German weather description.
      it.printf(
        133, 155,
        id(font_22),
        text_color,
        TextAlign::TOP_CENTER,
        "%s",
        current_condition_de
      );

      // Current temperature.
      if (!isnan(id(current_temperature).state)) {
        it.printf(
          133, 195,
          id(font_42),
          text_color,
          TextAlign::TOP_CENTER,
          "%.1f°C",
          id(current_temperature).state
        );
      }

      // --------------------------------------------------------
      // CURRENT PRECIPITATION
      // Format: today / yesterday
      // --------------------------------------------------------

      if (!isnan(id(rain_today).state) &&
          !isnan(id(rain_yesterday).state)) {

      it.printf(
        133, 255,
        id(font_22),
        text_color,
        TextAlign::TOP_CENTER,
        "%.1f mm / %.1f mm",
        id(rain_today).state,
        id(rain_yesterday).state
      );
      }

      // --------------------------------------------------------
      // SUNRISE AND SUNSET
      // --------------------------------------------------------
      const std::string sunrise = id(sunrise_time).state;
      const std::string sunset = id(sunset_time).state;

      if (sunrise.length() >= 16 && sunset.length() >= 16) {
        // Sunrise: Symbol
        it.printf(
          50, 285,
          id(sym_sun),
          text_color,
          TextAlign::TOP_RIGHT,
          "\U000F059C"
        );

        // Sunrise: Time
        it.printf(
          55, 285,
          id(font_22),
          text_color,
          TextAlign::TOP_LEFT,
          "%s",
          sunrise.substr(11, 5).c_str()
        );

        // Sunset: Symbol
        it.printf(
          160, 285,
          id(sym_sun),
          text_color,
          TextAlign::TOP_RIGHT,
          "\U000F059B"
        );

        // Sunset: Time
        it.printf(
          165, 285,
          id(font_22),
          text_color,
          TextAlign::TOP_LEFT,
          "%s",
          sunset.substr(11, 5).c_str()
        );
      }

      // --------------------------------------------------------
      // MOON PHASE
      // Aktuelle Mondphase mit Symbol und deutscher Bezeichnung
      // --------------------------------------------------------

      // Aktuelle Mondphase aus Home Assistant auslesen
      const std::string moon = id(moon_phase).state;

      // Position der Mondphasenanzeige
      const int moon_x = 133;
      const int moon_y = 315;

      // Standardwerte: Neumond
      const char *moon_icon = "\U000F0F65";
      const char *moon_name = "Vollmond";

      // Mondphase anhand des Home-Assistant-Zustands bestimmen
      if (moon == "waxing_crescent") {
        moon_icon = "\U000F0F62";
        moon_name = "Zunehmende Sichel";
      } else if (moon == "first_quarter") {
        moon_icon = "\U000F0F63";
        moon_name = "Erstes Viertel";
      } else if (moon == "waxing_gibbous") {
        moon_icon = "\U000F0F64";
        moon_name = "Zunehmender Mond";
      } else if (moon == "full_moon") {
        moon_icon = "\U000F0F65";
        moon_name = "Vollmond";
      } else if (moon == "waning_gibbous") {
        moon_icon = "\U000F0F66";
        moon_name = "Abnehmender Mond";
      } else if (moon == "last_quarter") {
        moon_icon = "\U000F0F67";
        moon_name = "Letztes Viertel";
      } else if (moon == "waning_crescent") {
        moon_icon = "\U000F0F68";
        moon_name = "Abnehmende Sichel";
      }

      // Mondphasensymbol mittig ausgeben
      it.printf(
        moon_x, moon_y,
        id(sym_moon),
        text_color,
        TextAlign::TOP_CENTER,
        "%s",
        moon_icon
      );

      // Deutsche Bezeichnung unterhalb des Symbols ausgeben
      it.printf(
        moon_x, moon_y + 95,
        id(font_22),
        text_color,
        TextAlign::TOP_CENTER,
        "%s",
        moon_name
      );

      // --------------------------------------------------------
      // WEATHER FORECAST
      // --------------------------------------------------------

      // --------------------------------------------------------
      // HOURLY FORECAST
      // Area: X=266..800, Y=0..160
      // --------------------------------------------------------

      const int wx = 266;
      const int ww = 534;
      const int cw = ww / 4;

      const std::string hourly[] = {
        id(forecast_hour_1).state,
        id(forecast_hour_2).state,
        id(forecast_hour_3).state,
        id(forecast_hour_4).state
      };

      for (int i = 0; i < 4; i++) {
        char time[16] = "--";
        char condition[32] = "cloudy";
        float temp = 0;
        float probability = 0;
        float precipitation = 0;

        sscanf(
          hourly[i].c_str(),
          "%15[^|]|%31[^|]|%f|%f|%f",
          time, condition, &temp, &probability, &precipitation
        );

        const int cx = wx + i * cw + cw / 2;

        it.printf(
          cx, 10, id(font_18), text_color,
          TextAlign::TOP_CENTER, "%s", time
        );

        it.printf(
          cx, 31, id(sym_weather), text_color,
          TextAlign::TOP_CENTER, "%s", weather_icon(condition)
        );

        it.printf(
          cx, 94, id(font_18), text_color,
          TextAlign::TOP_CENTER, "%.1f °C", temp
        );

              // Niederschlag: Tropfen | Wahrscheinlichkeit / Menge
      it.printf(
        cx - 48, 113, id(sym_weather_small), text_color,
        TextAlign::TOP_CENTER, "\U000F058C"
      );

      it.printf(
        cx + 12, 113, id(font_18), text_color,
        TextAlign::TOP_CENTER, "%.0f%% / %.1f",
        probability, precipitation
      );
      }

      // --------------------------------------------------------
      // DAILY FORECAST
      // Area: X=266..800, Y=160..320
      // --------------------------------------------------------

      const std::string daily[] = {
        id(forecast_day_1).state,
        id(forecast_day_2).state,
        id(forecast_day_3).state,
        id(forecast_day_4).state
      };

      for (int i = 0; i < 4; i++) {
        char date[16] = "--";
        char day[8] = "--";
        char condition[32] = "cloudy";
        float high = 0;
        float low = 0;
        float probability = 0;
        float precipitation = 0;

        sscanf(
          daily[i].c_str(),
          "%15[^|]|%7[^|]|%31[^|]|%f|%f|%f|%f",
          date, day, condition, &high, &low, &probability, &precipitation
        );

        const int cx = wx + i * cw + cw / 2;

        // Weekday and date
        it.printf(
          cx, 165, id(font_18), text_color,
          TextAlign::TOP_CENTER, "%s %s", day, date
        );

        // Weather icon
        it.printf(
          cx, 187, id(sym_weather), text_color,
          TextAlign::TOP_CENTER, "%s", weather_icon(condition)
        );

        // High and low temperatures
        it.printf(
          cx, 251, id(font_18), text_color,
          TextAlign::TOP_CENTER, "%.1f / %.1f °C", high, low
        );

        // Niederschlag: Tropfen | Wahrscheinlichkeit / Menge
        it.printf(
          cx - 48, 276, id(sym_weather_small), text_color,
          TextAlign::TOP_CENTER, "\U000F058C"
        );

        it.printf(
          cx + 12, 276, id(font_18), text_color,
          TextAlign::TOP_CENTER, "%.0f%% / %.1f",
          probability, precipitation
        );
      }

      // --------------------------------------------------------
      // BIRTHDAY CALENDAR
      // Area: X = 400..800, Y = 266..480
      // Four rows, no heading.
      // --------------------------------------------------------

      const int calendar_y = 320;
      const int calendar_height = 160;
      const int row_height = 40;

      // Column boundaries:
      // Weekday | Date | Description | Age
      const int x0 = 266;
      const int x1 = 298;
      const int x2 = 356;
      const int x3 = 768;
      const int x4 = 800;

      // Outer border
      it.rectangle(
        x0,
        calendar_y,
        x4 - x0,
        calendar_height,
        text_color
      );

      // Horizontal row separators
      for (int row = 1; row < 4; row++) {
        const int y =
          calendar_y + row * row_height;

        it.line(
          x0,
          y,
          x4 - 1,
          y,
          text_color
        );
      }

      // Vertical column separators
      it.line(
        x1, calendar_y,
        x1, calendar_y + calendar_height,
        text_color
      );

      it.line(
        x2, calendar_y,
        x2, calendar_y + calendar_height,
        text_color
      );

      it.line(
        x3, calendar_y,
        x3, calendar_y + calendar_height,
        text_color
      );

      // --------------------------------------------------------
      // Read calendar values from Home Assistant
      // Sensors are defined in packages/sensors.yaml
      // --------------------------------------------------------

      const char *days[] = {
        id(calendar_a1).state.c_str(),
        id(calendar_a2).state.c_str(),
        id(calendar_a3).state.c_str(),
        id(calendar_a4).state.c_str()
      };

      const char *dates[] = {
        id(calendar_b1).state.c_str(),
        id(calendar_b2).state.c_str(),
        id(calendar_b3).state.c_str(),
        id(calendar_b4).state.c_str()
      };

      const char *descriptions[] = {
        id(calendar_c1).state.c_str(),
        id(calendar_c2).state.c_str(),
        id(calendar_c3).state.c_str(),
        id(calendar_c4).state.c_str()
      };

      const char *ages[] = {
        id(calendar_d1).state.c_str(),
        id(calendar_d2).state.c_str(),
        id(calendar_d3).state.c_str(),
        id(calendar_d4).state.c_str()
      };

      // --------------------------------------------------------
      // Draw the four calendar rows
      // --------------------------------------------------------

      for (int row = 0; row < 4; row++) {
        const int center_y =
          calendar_y + row * row_height + row_height / 2;

        // Weekday
        it.printf(
          (x0 + x1) / 2,
          center_y,
          id(font_18),
          text_color,
          TextAlign::CENTER,
          "%s",
          days[row]
        );

        // Date
        it.printf(
          (x1 + x2) / 2,
          center_y,
          id(font_18),
          text_color,
          TextAlign::CENTER,
          "%s",
          dates[row]
        );

        // Description
        it.printf(
          x2 + 8,
          center_y,
          id(font_18),
          text_color,
          TextAlign::CENTER_LEFT,
          "%s",
          descriptions[row]
        );

        // Age
        it.printf(
          (x3 + x4) / 2,
          center_y,
          id(font_18),
          text_color,
          TextAlign::CENTER,
          "%s",
          ages[row]
        );
      }
