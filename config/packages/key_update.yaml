
## ============================================================
## KEY0 - Manual Display Refresh
## Seeed reTerminal E1001 / ESP32-S3
## ============================================================
##
## KEY0: GPIO3, right green button, active LOW
##
## When the button is pressed during deep sleep:
##   - The ESP32-S3 wakes up via EXT1.
##   - The display driver is reinitialized during boot.
##   - The wake-up reason is detected and a refresh is scheduled.
##   - The refresh takes place after Home Assistant time synchronization.
## ============================================================

globals:
  - id: key_update_wakeup
    type: bool
    restore_value: no
    initial_value: "false"

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            const esp_sleep_wakeup_cause_t cause =
              esp_sleep_get_wakeup_cause();

            ESP_LOGI(
              "key_update",
              "Wake-up cause raw value: %d",
              static_cast<int>(cause)
            );

            id(key_update_wakeup) =
              (cause == ESP_SLEEP_WAKEUP_EXT1);

            if (id(key_update_wakeup)) {
              ESP_LOGI(
                "key_update",
                "KEY0 wake-up detected (EXT1): forcing display refresh"
              );
            } else {
              ESP_LOGI(
                "key_update",
                "No KEY0 wake-up; wake-up cause: %d",
                static_cast<int>(cause)
              );
            }

deep_sleep:
  id: deep_sleep_1
  esp32_ext1_wakeup:
    pins:
      - number: GPIO3
        mode:
          input: true
          pullup: true
    mode: ANY_LOW
