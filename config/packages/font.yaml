# ============================================================
# FONTS
# ============================================================

font:

# ============================================================
# FONT 18
# Used in forecast hourly/daily, birthday calender
# ============================================================

  - file: ${font_file}
    id: font_18
    size: 18
    glyphs: !include "../../fonts/glyphs.yaml"

# ============================================================
# FONT 22
# Used in current weather, current precipitation,
#  Sunrise / Sunset and moon phase name
# ============================================================

  - file: ${font_file}
    id: font_22
    size: 22
    glyphs: !include "../../fonts/glyphs.yaml"

# ============================================================
# FONT 42
# Used in current temperature and curren date
# ============================================================

  - file: ${font_file}
    id: font_42
    size: 42
    glyphs: !include "../../fonts/glyphs.yaml"
