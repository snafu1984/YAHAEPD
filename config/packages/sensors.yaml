text_sensor:

  # ==========================================================
  # CURRENT WEATHER
  # ==========================================================

  - platform: homeassistant
    id: current_weather_condition
    entity_id: weather.forecast_home

  # --------------------------------------------------------
  # MOON PHASE
  # Aktuelle Mondphase aus Home Assistant
  # Quelle: sensor.moon_phase
  # --------------------------------------------------------
  - platform: homeassistant
    entity_id: sensor.moon_phase
    id: moon_phase
    internal: true


  # --------------------------------------------------------
  # MOONRISE
  # Next moonrise from Home Assistant
  # Source: sensor.display_moonrise
  # --------------------------------------------------------
  - platform: homeassistant
    id: moonrise_time
    entity_id: sensor.display_moonrise
    internal: true

  # --------------------------------------------------------
  # MOONSET
  # Next moonset from Home Assistant
  # Source: sensor.display_moonset
  # --------------------------------------------------------
  - platform: homeassistant
    id: moonset_time
    entity_id: sensor.display_moonset
    internal: true


  # --------------------------------------------------------
  # SUNRISE
  # Next sunrise from Home Assistant
  # Source: sun.sun
  # Attribute: next_rising
  # --------------------------------------------------------
  - platform: homeassistant
    entity_id: sensor.display_sunrise
    id: sunrise_time
    internal: true

  # --------------------------------------------------------
  # SUNSET
  # Next sunset from Home Assistant
  # Source: sun.sun
  # Attribute: next_setting
  # --------------------------------------------------------
  - platform: homeassistant
    entity_id: sensor.display_sunset
    id: sunset_time
    internal: true

  # ==========================================================
  # HOURLY WEATHER FORECAST
  # ==========================================================

  - platform: homeassistant
    id: forecast_hour_1
    entity_id: sensor.display_forecast_hour_1

  - platform: homeassistant
    id: forecast_hour_2
    entity_id: sensor.display_forecast_hour_2

  - platform: homeassistant
    id: forecast_hour_3
    entity_id: sensor.display_forecast_hour_3

  - platform: homeassistant
    id: forecast_hour_4
    entity_id: sensor.display_forecast_hour_4

  # ==========================================================
  # DAILY WEATHER FORECAST
  # ==========================================================

  - platform: homeassistant
    id: forecast_day_1
    entity_id: sensor.display_forecast_day_1

  - platform: homeassistant
    id: forecast_day_2
    entity_id: sensor.display_forecast_day_2

  - platform: homeassistant
    id: forecast_day_3
    entity_id: sensor.display_forecast_day_3

  - platform: homeassistant
    id: forecast_day_4
    entity_id: sensor.display_forecast_day_4

# ============================================================
# BIRTHDAY CALENDAR SENSORS
# ============================================================

  - platform: homeassistant
    id: calendar_a1
    entity_id: sensor.display_a1

  - platform: homeassistant
    id: calendar_b1
    entity_id: sensor.display_b1

  - platform: homeassistant
    id: calendar_c1
    entity_id: sensor.display_c1

  - platform: homeassistant
    id: calendar_d1
    entity_id: sensor.display_d1

  - platform: homeassistant
    id: calendar_a2
    entity_id: sensor.display_a2

  - platform: homeassistant
    id: calendar_b2
    entity_id: sensor.display_b2

  - platform: homeassistant
    id: calendar_c2
    entity_id: sensor.display_c2

  - platform: homeassistant
    id: calendar_d2
    entity_id: sensor.display_d2

  - platform: homeassistant
    id: calendar_a3
    entity_id: sensor.display_a3

  - platform: homeassistant
    id: calendar_b3
    entity_id: sensor.display_b3

  - platform: homeassistant
    id: calendar_c3
    entity_id: sensor.display_c3

  - platform: homeassistant
    id: calendar_d3
    entity_id: sensor.display_d3

  - platform: homeassistant
    id: calendar_a4
    entity_id: sensor.display_a4

  - platform: homeassistant
    id: calendar_b4
    entity_id: sensor.display_b4

  - platform: homeassistant
    id: calendar_c4
    entity_id: sensor.display_c4

  - platform: homeassistant
    id: calendar_d4
    entity_id: sensor.display_d4


# ============================================================
# CURRENT WEATHER AND RAINFALL SENSORS
# ============================================================

sensor:
  - platform: homeassistant
    id: current_temperature
    entity_id: weather.forecast_home
    attribute: temperature

  - platform: homeassistant
    id: rain_today
    entity_id: sensor.plantage_niederschlag_heute

  - platform: homeassistant
    id: rain_yesterday
    entity_id: sensor.plantage_niederschlag_letzter_tag


